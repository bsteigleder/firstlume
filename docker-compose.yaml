# Local development services. Postgres: make dev-db. Gitea (optional): make dev-gitea.
# Garage (optional, S3 storage for Terraform state): make dev-garage
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: firstlume
      POSTGRES_PASSWORD: firstlume
      POSTGRES_DB: firstlume
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstlume"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A Git server to develop the Gitea connection against (profile "gitea").
  gitea:
    image: gitea/gitea:1.27.3
    profiles: ["gitea"]
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://127.0.0.1:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__service__DISABLE_REGISTRATION: "true"
      # The server of `make run-server` is on a private address (spec 0006, M4).
      GITEA__webhook__ALLOWED_HOST_LIST: private,loopback
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - giteadata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/v1/version || wget -qO- http://localhost:3000/api/v1/version"]
      interval: 3s
      timeout: 3s
      retries: 40

  # S3-compatible storage for Terraform state (profile "garage").
  garage:
    image: dxflrs/garage:v2.4.1
    profiles: ["garage"]
    environment:
      GARAGE_RPC_SECRET: ${FIRSTLUME_DEV_GARAGE_RPC_SECRET:-run make dev-garage}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./deploy/dev/garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Vault in dev mode (in memory: make dev-vault configures it again after a restart).
  vault:
    image: hashicorp/vault:2.0.4
    profiles: ["vault"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${FIRSTLUME_DEV_VAULT_ROOT_TOKEN:-run make dev-vault}
    cap_add: ["IPC_LOCK"]
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 30

  # An OCI registry with a login (make dev-registry writes the password file).
  registry:
    image: registry:3
    profiles: ["registry"]
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: firstlume-dev
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./deploy/dev/registry.htpasswd:/auth/htpasswd:ro
      - registrydata:/var/lib/registry

volumes:
  pgdata:
  giteadata:
  garagedata:
  registrydata:
