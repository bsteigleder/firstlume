# Local development services. Postgres: make dev-db. Gitea (optional): make dev-gitea.
# Garage (optional, S3 storage for Terraform state): make dev-garage
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: firstlume
      POSTGRES_PASSWORD: firstlume
      POSTGRES_DB: firstlume
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstlume"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A Git server to develop the Gitea connection against (profile "gitea").
  gitea:
    image: gitea/gitea:1.27.3
    profiles: ["gitea"]
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://127.0.0.1:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - giteadata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/v1/version || wget -qO- http://localhost:3000/api/v1/version"]
      interval: 3s
      timeout: 3s
      retries: 40

  # S3-compatible storage for Terraform state (profile "garage").
  garage:
    image: dxflrs/garage:v2.4.1
    profiles: ["garage"]
    environment:
      GARAGE_RPC_SECRET: ${FIRSTLUME_DEV_GARAGE_RPC_SECRET:-run make dev-garage}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./deploy/dev/garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  pgdata:
  giteadata:
  garagedata:
