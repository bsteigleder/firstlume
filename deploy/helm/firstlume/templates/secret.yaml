{{- if and .Values.controlPlane.enabled (not .Values.controlPlane.existingSecret) }}
{{- $name := include "firstlume.controlPlaneSecret" . }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "firstlume.labels" . | nindent 4 }}
  annotations:
    # Losing secret-key makes encrypted data unreadable, so never delete it with the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ include "firstlume.persistedSecret" (dict "namespace" $ns "name" $name "key" "secret-key" "generate" (randBytes 32)) }}
  admin-token: {{ include "firstlume.persistedSecret" (dict "namespace" $ns "name" $name "key" "admin-token" "generate" (printf "fl_admin_%s" (randAlphaNum 40))) }}
  agent-token: {{ include "firstlume.persistedSecret" (dict "namespace" $ns "name" $name "key" "agent-token" "generate" (printf "fla_%s" (randAlphaNum 40))) }}
{{- end }}
---
{{- if and .Values.controlPlane.enabled .Values.postgresql.enabled }}
{{- $name := printf "%s-postgresql" (include "firstlume.fullname" .) }}
{{- $password := include "firstlume.persistedSecret" (dict "namespace" .Release.Namespace "name" $name "key" "password" "generate" (randAlphaNum 32)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "firstlume.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password }}
  database-url: {{ printf "postgres://firstlume:%s@%s.%s.svc:5432/firstlume?sslmode=disable" ($password | b64dec) $name .Release.Namespace | b64enc }}
{{- end }}
---
{{- if and .Values.agent.enabled (not .Values.controlPlane.enabled) (not .Values.agent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "firstlume.fullname" . }}-agent
  labels:
    {{- include "firstlume.labels" . | nindent 4 }}
type: Opaque
data:
  agent-token: {{ required "agent.token (or agent.existingSecret) is required when controlPlane.enabled=false" .Values.agent.token | b64enc }}
{{- end }}
