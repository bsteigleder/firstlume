{{- if .Values.controlPlane.enabled }}
{{- $fullname := include "firstlume.fullname" . }}
{{- $dbSecret := "" }}
{{- $dbKey := "database-url" }}
{{- if .Values.postgresql.enabled }}
{{- $dbSecret = printf "%s-postgresql" $fullname }}
{{- else if .Values.controlPlane.database.existingSecret }}
{{- $dbSecret = .Values.controlPlane.database.existingSecret }}
{{- $dbKey = .Values.controlPlane.database.existingSecretKey }}
{{- else }}
{{- $_ := required "controlPlane.database.url, controlPlane.database.existingSecret or postgresql.enabled is required" .Values.controlPlane.database.url }}
{{- end }}
{{- if not $dbSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-database
  labels:
    {{- include "firstlume.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ .Values.controlPlane.database.url | b64enc }}
---
{{- $dbSecret = printf "%s-database" $fullname }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "firstlume.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      {{- include "firstlume.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "firstlume.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- with .Values.controlPlane.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "firstlume.podSecurityContext" . | nindent 8 }}
      containers:
        - name: server
          image: {{ include "firstlume.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FIRSTLUME_LISTEN_ADDR
              value: ":8080"
            - name: FIRSTLUME_ORGANIZATION
              value: {{ .Values.controlPlane.organization | quote }}
            - name: FIRSTLUME_HEARTBEAT_TIMEOUT
              value: {{ .Values.controlPlane.heartbeatTimeout | quote }}
            {{- $ing := .Values.controlPlane.ingress }}
            {{- $public := .Values.controlPlane.publicURL }}
            {{- if and (not $public) $ing.enabled $ing.host }}
            {{- $public = printf "%s://%s" (ternary "https" "http" (gt (len $ing.tls) 0)) $ing.host }}
            {{- end }}
            {{- with $public }}
            - name: FIRSTLUME_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.controlPlane.state }}
            - name: FIRSTLUME_STATE_MAX_MIB
              value: {{ .maxMiB | quote }}
            - name: FIRSTLUME_STATE_KEEP_VERSIONS
              value: {{ .keepVersions | quote }}
            - name: FIRSTLUME_STATE_STORAGE
              value: {{ .storage | quote }}
            - name: FIRSTLUME_STATE_STORAGE_ALLOW_HTTP
              value: {{ .allowHTTPOrgStorage | default false | quote }}
            {{- if eq .storage "s3" }}
            - name: FIRSTLUME_STATE_S3_ENDPOINT
              value: {{ required "controlPlane.state.s3.endpoint is required with storage: s3" .s3.endpoint | quote }}
            - name: FIRSTLUME_STATE_S3_BUCKET
              value: {{ required "controlPlane.state.s3.bucket is required with storage: s3" .s3.bucket | quote }}
            - name: FIRSTLUME_STATE_S3_REGION
              value: {{ .s3.region | quote }}
            - name: FIRSTLUME_STATE_S3_PREFIX
              value: {{ .s3.prefix | quote }}
            - name: FIRSTLUME_STATE_S3_PATH_STYLE
              value: {{ .s3.pathStyle | quote }}
            - name: FIRSTLUME_STATE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "controlPlane.state.s3.existingSecret is required with storage: s3" .s3.existingSecret }}
                  key: {{ .s3.accessKeyIdKey }}
            - name: FIRSTLUME_STATE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .s3.existingSecret }}
                  key: {{ .s3.secretAccessKeyKey }}
            {{- else if ne .storage "postgres" }}
            {{- fail "controlPlane.state.storage must be postgres or s3" }}
            {{- end }}
            {{- end }}
            - name: FIRSTLUME_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ $dbKey }}
            - name: FIRSTLUME_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "firstlume.controlPlaneSecret" . }}
                  key: secret-key
            - name: FIRSTLUME_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "firstlume.controlPlaneSecret" . }}
                  key: admin-token
            - name: FIRSTLUME_ADMIN_TOKEN_LOGIN
              value: {{ .Values.controlPlane.auth.adminTokenLogin | quote }}
            {{- with .Values.controlPlane.auth.oidc }}
            {{- if .enabled }}
            {{- if not $public }}
            {{- fail "controlPlane.publicURL (or an ingress host) is required with controlPlane.auth.oidc.enabled" }}
            {{- end }}
            - name: FIRSTLUME_OIDC_PROVIDER_NAME
              value: {{ .providerName | quote }}
            - name: FIRSTLUME_OIDC_ISSUER
              value: {{ required "controlPlane.auth.oidc.issuer is required with OIDC" .issuer | quote }}
            - name: FIRSTLUME_OIDC_CLIENT_ID
              value: {{ required "controlPlane.auth.oidc.clientId is required with OIDC" .clientId | quote }}
            - name: FIRSTLUME_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "controlPlane.auth.oidc.existingSecret is required with OIDC" .existingSecret }}
                  key: {{ .clientSecretKey }}
            - name: FIRSTLUME_OIDC_SCOPES
              value: {{ join " " .scopes | quote }}
            - name: FIRSTLUME_OIDC_GROUPS_CLAIM
              value: {{ .groupsClaim | quote }}
            - name: FIRSTLUME_OIDC_ALLOWED_GROUPS
              value: {{ join "," .allowedGroups | quote }}
            - name: FIRSTLUME_OIDC_ADMIN_GROUPS
              value: {{ join "," .adminGroups | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.agent.enabled }}
            # Registers the agent that ships in this release.
            - name: FIRSTLUME_BOOTSTRAP_AGENT_NAME
              value: {{ .Values.agent.name | quote }}
            - name: FIRSTLUME_BOOTSTRAP_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "firstlume.controlPlaneSecret" . }}
                  key: agent-token
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            {{- include "firstlume.containerSecurityContext" . | nindent 12 }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "firstlume.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.controlPlane.service.type }}
  selector:
    {{- include "firstlume.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.controlPlane.service.port }}
      targetPort: http
{{- if gt (int .Values.controlPlane.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "firstlume.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "firstlume.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
{{- if .Values.controlPlane.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "firstlume.labels" . | nindent 4 }}
  annotations:
    # Log streaming uses Server-Sent Events; don't buffer or cut them short.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    {{- with .Values.controlPlane.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.controlPlane.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.controlPlane.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "controlPlane.ingress.host is required when the ingress is enabled" .Values.controlPlane.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
{{- end }}
{{- end }}
